<script>

/* =========================================================
   SAUDIDEALS CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
    "https://frkzfzhcgtfgadvvqgje.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_rcqTalygq3UwWu5luSNPNQ_P8t1OniI";


/* =========================================================
   GLOBAL DATA
   ========================================================= */

let products = [];

let currentSearch = "";

let databaseLoaded = false;


/* =========================================================
   HELPERS
   ========================================================= */

function money(value){

    const number = Number(value);

    if(!Number.isFinite(number)){
        return "Price unavailable";
    }

    return number.toLocaleString("en-SA",{
        style:"currency",
        currency:"SAR",
        maximumFractionDigits:2
    });
}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function slugify(text){

    return String(text || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-+|-+$/g,"");
}


function iconFor(category,name){

    const text =
        ((category || "") + " " + (name || "")).toLowerCase();

    if(text.includes("iphone") || text.includes("phone") || text.includes("mobile"))
        return "📱";

    if(text.includes("laptop") || text.includes("macbook") || text.includes("computer"))
        return "💻";

    if(text.includes("playstation") || text.includes("xbox") || text.includes("gaming"))
        return "🎮";

    if(text.includes("tv") || text.includes("television"))
        return "📺";

    if(text.includes("headphone") || text.includes("airpods") || text.includes("audio"))
        return "🎧";

    if(text.includes("watch"))
        return "⌚";

    if(text.includes("camera"))
        return "📷";

    if(text.includes("kitchen") || text.includes("home"))
        return "🏠";

    if(text.includes("beauty"))
        return "💄";

    if(text.includes("fashion") || text.includes("shoe"))
        return "👟";

    return "🛍️";
}


/* =========================================================
   DATABASE PRODUCT NORMALIZATION
   ========================================================= */

function normalizeProduct(row,index){

    const price =
        Number(row.price);

    const oldPrice =
        row.old_price === null ||
        row.old_price === undefined ||
        row.old_price === ""
            ? null
            : Number(row.old_price);

    let discount = 0;

    if(
        Number.isFinite(price) &&
        Number.isFinite(oldPrice) &&
        oldPrice > price
    ){
        discount =
            Math.round(((oldPrice-price)/oldPrice)*100);
    }

    return {

        id:
            row.id ??
            slugify(row.name) ??
            "product-"+index,

        name:
            row.name ||
            "Unnamed Product",

        category:
            row.category ||
            "Other",

        price:
            Number.isFinite(price)
                ? price
                : null,

        old_price:
            Number.isFinite(oldPrice)
                ? oldPrice
                : null,

        image_url:
            row.image_url ||
            "",

        product_url:
            row.product_url ||
            "",

        store:
            row.store ||
            "Online Store",

        affiliate_url:
            row.affiliate_url ||
            row.product_url ||
            "",

        description:
            row.description ||
            "Find this product and compare available shopping options on SaudiDeals.",

        updated_at:
            row.updated_at ||
            "",

        discount

    };
}


/* =========================================================
   SUPABASE DATABASE
   ========================================================= */

async function loadProducts(){

    const status =
        document.getElementById("dbStatus");

    if(
        !SUPABASE_PUBLISHABLE_KEY ||
        SUPABASE_PUBLISHABLE_KEY ===
        "PASTE_YOUR_NEW_PUBLISHABLE_KEY_HERE"
    ){

        if(status){

            status.className =
                "db-status status-warning";

            status.innerHTML =
                "⚠ Add your new Supabase publishable key to connect the database.";

        }

        products = [];

        loadHomeProducts();

        return;
    }


    if(status){

        status.className =
            "db-status status-warning";

        status.innerHTML =
            "Connecting to SaudiDeals database...";
    }


    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/Products?select=*&order=updated_at.desc";

        const response =
            await fetch(url,{

                method:"GET",

                headers:{
                    "apikey":
                        SUPABASE_PUBLISHABLE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_PUBLISHABLE_KEY,

                    "Content-Type":
                        "application/json"
                }

            });


        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(
                "Supabase error " +
                response.status +
                ": " +
                errorText
            );
        }


        const rows =
            await response.json();


        products =
            Array.isArray(rows)
                ? rows.map(normalizeProduct)
                : [];


        databaseLoaded = true;


        if(status){

            status.className =
                "db-status status-success";

            if(products.length > 0){

                status.innerHTML =
                    "✓ Live products loaded automatically from SaudiDeals database.";

            }else{

                status.innerHTML =
                    "✓ Database connected. No products have been imported yet.";

            }
        }


        loadHomeProducts();


    }catch(error){

        console.error(
            "SaudiDeals database error:",
            error
        );


        products = [];


        if(status){

            status.className =
                "db-status status-error";

            status.innerHTML =
                "✕ Database connection failed. Check your Supabase key and RLS SELECT policy.";
        }


        loadHomeProducts();
    }
}


/* =========================================================
   PRODUCT CARD
   ========================================================= */

function productCard(product){

    const wished =
        getWishlist().includes(String(product.id));

    const image =
        product.image_url
            ? `
                <img
                    src="${escapeHtml(product.image_url)}"
                    alt="${escapeHtml(product.name)}"
                    loading="lazy"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
                >
                <div class="product-placeholder" style="display:none">
                    ${iconFor(product.category,product.name)}
                </div>
              `
            : `
                <div class="product-placeholder">
                    ${iconFor(product.category,product.name)}
                </div>
              `;


    const priceHtml =
        product.price !== null
            ? money(product.price)
            : "Price unavailable";


    const oldPriceHtml =
        product.old_price !== null &&
        product.old_price > product.price
            ? `<span class="old-price">${money(product.old_price)}</span>`
            : "";


    const discountHtml =
        product.discount > 0
            ? `<div class="discount">${product.discount}% OFF</div>`
            : "";


    return `

        <article class="product-card">

            <div class="product-image">

                <button
                    class="wishlist-btn ${wished ? "active":""}"
                    onclick="toggleWishlist('${escapeHtml(String(product.id))}')"
                    aria-label="Add to wishlist"
                >
                    ${wished ? "♥":"♡"}
                </button>

                ${image}

            </div>


            <div class="product-info">

                <div class="product-store">
                    ${escapeHtml(product.store)}
                </div>

                <div class="product-name">
                    ${escapeHtml(product.name)}
                </div>

                <div>
                    <span class="product-price">
                        ${priceHtml}
                    </span>

                    ${oldPriceHtml}
                </div>

                ${discountHtml}


                <div class="product-actions">

                    <button
                        class="view-btn"
                        onclick="openProduct('${escapeHtml(String(product.id))}')"
                    >
                        Compare
                    </button>

                    <button
                        class="deal-btn"
                        onclick="merchantClick('${escapeHtml(product.store)}','${escapeHtml(product.name)}','${escapeHtml(product.affiliate_url || product.product_url)}')"
                    >
                        View Deal
                    </button>

                </div>

            </div>

        </article>

    `;
}


/* =========================================================
   HOME PAGE
   ========================================================= */

function homeTemplate(){

    return `

        <section class="hero">

            <div class="container hero-content">

                <h1>
                    Find the <span>Best Deals</span>
                    in Saudi Arabia

function loadHomeProducts(){

    const app =
        document.getElementById("app");

    if(!app){

        return;
    }


    if(
        !app.innerHTML ||
        !app.innerHTML.includes("Today's Best Deals")
    ){

        app.innerHTML =
            homeTemplate();

    }


    const container =
        document.getElementById("homeProducts");


    if(!container){

        return;
    }


    if(products.length === 0){

        container.innerHTML = `

            <div class="empty-state">

                <h3>No products yet</h3>

                <p>
                    Your SaudiDeals database is connected,
                    but products have not been imported yet.
                </p>

            </div>

        `;

        return;
    }


    const sorted =
        [...products]
            .sort((a,b) => {

                const discountA =
                    Number(a.discount || 0);

                const discountB =
                    Number(b.discount || 0);

                return discountB - discountA;

            })
            .slice(0,12);


    container.innerHTML =
        sorted
            .map(productCard)
            .join("");
}


/* =========================================================
   SEARCH
   ========================================================= */

function performHeroSearch(){

    const hero =
        document.getElementById("heroSearch");

    const top =
        document.getElementById("topSearch");


    const query =
        hero?.value?.trim() ||
        top?.value?.trim() ||
        "";


    performSearch(query);
}


function performSearch(queryOverride){

    const query =
        String(
            queryOverride ??
            document.getElementById("topSearch")?.value ??
            ""
        ).trim();


    currentSearch =
        query;


    history.pushState(
        {page:"search",query},
        "",
        "#search=" +
        encodeURIComponent(query)
    );


    renderSearchResults(
        query
    );
}


function renderSearchResults(
    query,
    suppliedResults=null
){

    let results;


    if(suppliedResults){

        results =
            suppliedResults;

    }else{

        const q =
            query.toLowerCase();


        if(!q){

            results =
                [...products];

        }else{

            results =
                products.filter(product => {

                    const searchable = [

                        product.name,

                        product.category,

                        product.store,

                        product.description

                    ]
                    .join(" ")
                    .toLowerCase();


                    return searchable.includes(q);

                });

        }

    }


    const app =
        document.getElementById("app");


    app.innerHTML = `

        <section class="search-page">

            <div class="container">

                <button
                    class="back-btn"
                    onclick="goHome()"
                >
                    ← Back to Home
                </button>


                <div class="search-heading">

                    <h2>
                        ${
                            query
                                ? "Search results"
                                : "All Deals"
                        }
                    </h2>

                    <p>
                        ${
                            query
                                ? `${results.length} result(s) for "${escapeHtml(query)}"`
                                : `${results.length} products available`
                        }
                    </p>

                </div>


                <div class="product-grid">

                    ${
                        results.length
                            ? results.map(productCard).join("")
                            : `
                                <div class="empty-state">

                                    <h3>
                                        No products found
                                    </h3>

                                    <p>
                                        Try another product name or category.
                                    </p>

                                </div>
                              `
                    }

                </div>

            </div>

        </section>

    `;
}


/* =========================================================

/* =========================================================
   MERCHANT / AFFILIATE CLICK
   ========================================================= */

function merchantClick(
    store,
    productName,
    url
){

    if(!url){

        alert(
            "The merchant link for this product has not been added yet."
        );

        return;
    }


    if(
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ){

        alert(
            "Invalid merchant URL."
        );

        return;
    }


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );
}


/* =========================================================
   WISHLIST
   ========================================================= */

function getWishlist(){

    try{

        const data =
            localStorage.getItem(
                "saudideals_wishlist"
            );


        const parsed =
            JSON.parse(data || "[]");


        return Array.isArray(parsed)
            ? parsed.map(String)
            : [];

    }catch{

        return [];

    }
}


function saveWishlist(list){

    localStorage.setItem(
        "saudideals_wishlist",
        JSON.stringify(list)
    );
}


function toggleWishlist(id){

    const key =
        String(id);


    let list =
        getWishlist();


    if(list.includes(key)){

        list =
            list.filter(
                item => item !== key
            );

    }else{

        list.push(key);

    }


    saveWishlist(list);


    const currentProduct =
        products.find(
            p => String(p.id) === key
        );


    if(
        location.hash.startsWith("#product=") &&
        currentProduct
    ){

        openProduct(
            key,
            true
        );

    }else{

        if(location.hash.startsWith("#wishlist")){

            renderWishlist();

        }else{

            loadHomeProducts();

        }

    }

}


function showWishlist(
    fromHistory=false
){

    if(!fromHistory){

        history.pushState(
            {page:"wishlist"},
            "",
            "#wishlist"
        );

    }


    renderWishlist();
}


function renderWishlist(){

    const ids =
        getWishlist();


    const saved =
        products.filter(
            product =>
                ids.includes(String(product.id))
        );


    const app =
        document.getElementById("app");


    app.innerHTML = `

        <section class="search-page">

            <div class="container">

                <button
                    class="back-btn"
                    onclick="browserBack()"
                >
                    ← Back
                </button>


                <div class="search-heading">

                    <h2>
                        My Wishlist
                    </h2>

                    <p>
                        ${saved.length} saved product(s)
                    </p>

                </div>


                <div class="product-grid">

                    ${
                        saved.length
                            ? saved.map(productCard).join("")
                            : `
                                <div class="empty-state">

                                    <h3>
                                        Your wishlist is empty
                                    </h3>

                                    <p>
                                        Tap ♡ on a product to save it here.
                                    </p>

                                </div>
                              `
                    }

                </div>

            </div>

        </section>

    `;
}

/* =========================================================
   NAVIGATION / BROWSER HISTORY
   ========================================================= */

function browserBack(){

    if(history.length > 1){

        history.back();

    }else{

        goHome();

    }
}


function goHome(
    fromHistory=false
){

    if(!fromHistory){

        history.pushState(
            {page:"home"},
            "",
            "#home"
        );

    }


    document.getElementById("app").innerHTML =
        homeTemplate();


    loadHomeProducts();
}


/* =========================================================
   POPSTATE
   ========================================================= */

window.addEventListener(
    "popstate",
    function(){

        loadInitialPage();

    }
);


/* =========================================================
   INITIAL PAGE / HASH
   ========================================================= */

function loadInitialPage(){

    const hash =
        location.hash;


    if(hash.startsWith("#product=")){

        const id =
            decodeURIComponent(
                hash.replace("#product=","")
            );


        openProduct(
            id,
            true
        );


        return;
    }


    if(hash.startsWith("#search=")){

        const query =
            decodeURIComponent(
                hash.replace("#search=","")
            );


        currentSearch =
            query;


        renderSearchResults(
            query
        );


        return;
    }


    if(hash === "#wishlist"){

        renderWishlist();

        return;
    }


    if(hash.startsWith("#info=")){

        const type =
            decodeURIComponent(
                hash.replace("#info=","")
            );


        showInfo(
            type,
            true
        );


        return;
    }


    goHome(true);
}


/* =========================================================
   SEARCH KEYBOARD SUPPORT
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key !== "Enter"
        ){

            return;
        }


        const active =
            document.activeElement;


        if(
            active &&
            (
                active.id === "topSearch" ||
                active.id === "heroSearch"
            )
        ){

            performHeroSearch();

        }

    }
);
